name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ['25.x']   # 项目实测版本（README 如实声明；22/24 未验证不声称）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      # CI runner 是管理员权限：Windows deny ACL 沙箱在管理员下失效（实测铁证：A-01 fail-closed -998）。
      # 完整 12 项验收（含沙箱组）需本地非管理员 Windows 实测——CI 只做类型检查保底。
      - run: npm run check
